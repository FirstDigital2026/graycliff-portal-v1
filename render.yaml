services:
  - type: web
    name: first-digital-graycliff-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATA_PATH
        value: /var/data/graycliff.db
      - key: FILE_PATH
        value: /var/data/files
    disk:
      name: graycliff-data
      mountPath: /var/data
      sizeGB: 5
