{% extends 'base.html' %}
{% block content %}
<div class="panel setup-error">
  <h1>Smartsheet setup needed</h1>
  <p>The portal is live, but it could not finish connecting to the Graycliff Smartsheet workspace.</p>
  <pre>{{ error }}</pre>
  {% if role == 'Admin' %}
  <form method="post" action="/admin/setup-smartsheet"><button>Build / Repair Graycliff Workspace</button></form>
  {% endif %}
</div>
{% endblock %}
