{% extends 'base.html' %}{% block content %}<div class="title"><h1>Small Projects</h1><a class="button" href="/jobs/new">Add Project</a></div><form class="filters"><input name="q" placeholder="Search address, CRQ, project"><select name="market"><option value="">All markets</option>{% for x in markets %}<option>{{x}}</option>{% endfor %}</select><select name="status"><option value="">All statuses</option>{% for x in statuses %}<option>{{x}}</option>{% endfor %}</select><label><input type="checkbox" name="mine" value="1"> My jobs</label><button>Filter</button></form><div class="table"><table><tr><th>Project</th><th>Market</th><th>Task / Address</th><th>Due</th><th>Status</th><th>Assigned</th></tr>{% for j in jobs %}<tr><td><a href="/jobs/{{j.project_id}}">{{j.project_id}}</a></td><td>{{j.market}}</td><td>{{j.task_name or j.address}}<small>{{j.crq}}</small></td><td>{{j.due_date or ''}}</td><td><span class="pill">{{j.status}}</span></td><td>{{j.assigned_to or 'Unassigned'}}</td></tr>{% endfor %}</table></div>{% endblock %}
