{% extends 'base.html' %}{% block content %}<div class="title"><h1>Add Small Project</h1></div><form method="post" class="panel grid">
<label>Market<select name="market" required>{% for x in markets %}<option>{{x}}</option>{% endfor %}</select></label>
<label>Task Name<input name="task_name" required></label><label>Address<input name="address"></label><label>City<input name="city"></label><label>CRQ Number<input name="crq"></label><label>Daily No<input name="daily_no"></label><label>Due Date<input type="date" name="due_date"></label><label>Priority<select name="priority">{% for x in priorities %}<option {% if x=='Normal' %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="wide">Manager Notes<textarea name="manager_notes"></textarea></label><div><button>Create Project</button></div></form>{% endblock %}
