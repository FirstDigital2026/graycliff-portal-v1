{% extends 'base.html' %}{% block content %}<div class="title"><h1>Portal Users</h1></div><div class="columns"><section class="panel"><h2>Add or Update User</h2><form method="post" class="stack"><label>Email<input type="email" name="email" required></label><label>Name<input name="display_name" required></label><label>Role<select name="role">{% for x in roles %}<option>{{x}}</option>{% endfor %}</select></label><fieldset><legend>Markets</legend>{% for x in markets %}<label><input type="checkbox" name="markets" value="{{x}}" checked> {{x}}</label>{% endfor %}</fieldset><label>Temporary Password<input type="password" name="password" required></label><button>Save User</button></form></section><section><h2>Current Users</h2><div class="table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Markets</th></tr>{% for u in users %}<tr><td>{{u.display_name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{u.markets}}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
